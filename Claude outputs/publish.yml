# .github/workflows/publish.yml  — lives in the PRIVATE dev repo
# Mirrors the private repo's main branch to the public repo, pushed by the org's GitHub App.
# Replace: <ORG>, polar-star-dev, polar-star, "refresh"
name: publish

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["refresh"]        # exact `name:` of the refresh workflow
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Runs only in the private repo. The mirrored copy of this file in the public repo does nothing.
    if: >
      github.repository == '<ORG>/polar-star-dev' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block restricted paths anywhere in history (fails closed)
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' .publish-deny > /tmp/deny || true
          [ -s /tmp/deny ] || { echo "::error::.publish-deny missing or empty"; exit 1; }
          hits=$(git log --name-only --format= HEAD | sort -u | grep -E -f /tmp/deny || true)
          if [ -n "$hits" ]; then echo "::error::Restricted paths in history:"; echo "$hits"; exit 1; fi

      - name: Block unapproved author/committer emails (fails closed)
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' .publish-authors > /tmp/allow || true
          [ -s /tmp/allow ] || { echo "::error::.publish-authors missing or empty"; exit 1; }
          bad=$(git log --format='%ae%n%ce' HEAD | sort -u | grep -vxF -f /tmp/allow || true)
          if [ -n "$bad" ]; then echo "::error::Unapproved emails in history:"; echo "$bad"; exit 1; fi

      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.PUBLISH_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISH_PRIVATE_KEY }}
          repositories: polar-star
          permission-contents: write
          permission-workflows: write

      - name: Push to public repo (fast-forward only; never --force)
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: git push "https://x-access-token:${TOKEN}@github.com/<ORG>/polar-star.git" HEAD:refs/heads/main

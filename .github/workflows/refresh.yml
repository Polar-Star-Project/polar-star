# Weekly: fetch new data in two groups side by side (main, money) on the publisher's self-hosted runners, then test,
# rebuild the page and save it on GitHub.
# publish.yml then mirrors the result to the public repository, where pages.yml publishes the page.
# Also runs when started by hand (Actions tab > Refresh and publish > Run workflow).
name: Refresh and publish
on:
  schedule:
    - cron: "17 11 * * 1"        # Mondays 11:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these steps, comma-separated (blank = all). Example: tests,build"
        required: false
        default: ""
      skip:
        description: "Skip these steps, comma-separated. Example: flights"
        required: false
        default: ""
permissions:
  contents: write
  issues: write        # the weekly to-do is posted as a comment on one issue
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  main:
    # Every collector except the FEC and lobbying ones.
    if: github.repository == 'Polar-Star-Project/polar-star-development'
    runs-on: [self-hosted, polar-star]     # self-hosted runners (Docker on the publisher's PC): these long jobs use no billed minutes
    timeout-minutes: 340
    env:
      GROUP: main
      REFRESH_STATUS: data/refresh_status_main.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium          # its system libraries, tesseract and poppler are in the runner image
      - name: Refresh (main group)
        # Each step has its own time limit (refresh_all.py); this is a backstop for the group. The record of each step
        # is saved as it finishes, so a group cut off here still shows how far it got.
        timeout-minutes: 300
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}      # 120 lda.gov requests a minute instead of 15
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}   # court dockets for the disputes tab
          ONLY: ${{ github.event.inputs.only }}
          SKIP: ${{ github.event.inputs.skip }}
        run: |
          args="--group main"
          if [ -n "$ONLY" ]; then args="$args --only $ONLY"; fi
          if [ -n "$SKIP" ]; then args="$args --skip $SKIP"; fi
          xvfb-run -a python pipeline/refresh_all.py $args
      - name: Save this group's data to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%F) ($GROUP)"
          # the other group pushes too: replay this commit on top, keeping this group's freshly read data on a conflict
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((RANDOM % 20 + 5)); git pull --rebase -X theirs || { git rebase --abort; exit 1; }; done; exit 1
  money:
    # The FEC and lobbying collectors: slow, because those APIs limit requests per minute and hour.
    if: github.repository == 'Polar-Star-Project/polar-star-development'
    runs-on: [self-hosted, polar-star]     # self-hosted runners (Docker on the publisher's PC): these long jobs use no billed minutes
    timeout-minutes: 340
    env:
      GROUP: money
      REFRESH_STATUS: data/refresh_status_money.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium      # sec_watch reads one page in a browser; its system libraries are in the runner image
      - name: Refresh (money group)
        # Each step has its own time limit (refresh_all.py); this is a backstop for the group. The record of each step
        # is saved as it finishes, so a group cut off here still shows how far it got.
        timeout-minutes: 300
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}      # 120 lda.gov requests a minute instead of 15
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}   # court dockets for the disputes tab
          ONLY: ${{ github.event.inputs.only }}
          SKIP: ${{ github.event.inputs.skip }}
        run: |
          args="--group money"
          if [ -n "$ONLY" ]; then args="$args --only $ONLY"; fi
          if [ -n "$SKIP" ]; then args="$args --skip $SKIP"; fi
          xvfb-run -a python pipeline/refresh_all.py $args
      - name: Save this group's data to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%F) ($GROUP)"
          # the other group pushes too: replay this commit on top, keeping this group's freshly read data on a conflict
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((RANDOM % 20 + 5)); git pull --rebase -X theirs || { git rebase --abort; exit 1; }; done; exit 1
  build:
    # After both groups: join their records, test, rebuild the page, and save it. publish.yml mirrors the result.
    needs: [main, money]
    if: always() && github.repository == 'Polar-Star-Project/polar-star-development'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main          # what both groups saved, not the commit the run started from
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Test and rebuild the page
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}      # the tests check no file names a person; without it the page is not rebuilt
        run: |
          python pipeline/refresh_all.py --join data/refresh_status_main.json data/refresh_status_money.json
          xvfb-run -a python pipeline/refresh_all.py --only tests,build
      - name: Weekly to-do report
        if: always()
        continue-on-error: true
        run: python pipeline/todo_report.py
      - name: Save the page to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%F): page"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs || { git rebase --abort; exit 1; }; done; exit 1
      - name: Post the to-do on its issue
        # One open issue titled "Weekly to-do"; each run adds the week's list as a comment, so the publisher gets one
        # notification. Never fails the run.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f data/watch/todo.md ] || exit 0
          if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" != "true" ]; then
            echo "::warning::Issues are turned off for this repository (Settings > General > Features > Issues), so the to-do was not posted. It is still in data/watch/todo.md."; exit 0
          fi
          # list, not search: the search index lags, so an issue created a moment ago is not found by --search
          n=$(gh issue list --state open --limit 200 --json number,title --jq 'map(select(.title == "Weekly to-do")) | .[0].number // empty')
          if [ -z "$n" ]; then
            url=$(gh issue create --title "Weekly to-do" --body "Each weekly refresh adds a comment here listing everything that needs a person: court dockets that moved, dead links, help lines to check again, stale sources and failed steps. Leave this issue open.")
            n=${url##*/}
          fi
          echo "Posting the to-do on issue #$n"
          gh issue comment "$n" --body-file data/watch/todo.md

# Weekly: fetch new data, test, rebuild the page, save the data back to the repository.
# publish.yml then mirrors the result to the public repository, where pages.yml publishes the page.
# Also runs when started by hand (Actions tab > Refresh and publish > Run workflow).
name: Refresh and publish
on:
  schedule:
    - cron: "17 11 * * 1"        # Mondays 11:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these steps, comma-separated (blank = all). Example: tests,build"
        required: false
        default: ""
      skip:
        description: "Skip these steps, comma-separated. Example: flights"
        required: false
        default: ""
permissions:
  contents: write
  issues: write        # the weekly to-do is posted as a comment on one issue
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    # Runs only in the private working repository. The copy mirrored into the public repository does nothing.
    if: github.repository == 'Polar-Star-Project/polar-star-development'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Refresh
        id: refresh
        # Each step has its own time limit (refresh_all.py); this is a backstop. If the refresh is cut off, the run goes on to
        # rebuild and publish the page from whatever data it has, instead of being cancelled before it publishes.
        timeout-minutes: 290
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}      # optional: without it the political committee figures are left as they are
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}   # optional: the project's CourtListener account; court dockets for the disputes tab
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}      # the tests check no file names a person; without it the tests fail and the page is not rebuilt
          ONLY: ${{ github.event.inputs.only }}
          SKIP: ${{ github.event.inputs.skip }}
        run: |
          args=""
          if [ -n "$ONLY" ]; then args="$args --only $ONLY"; fi
          if [ -n "$SKIP" ]; then args="$args --skip $SKIP"; fi
          xvfb-run -a python pipeline/refresh_all.py $args
      - name: Rebuild the page if the refresh was cut off
        if: steps.refresh.outcome != 'success'
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: xvfb-run -a python pipeline/refresh_all.py --only tests,build
      - name: Weekly to-do report
        if: always()
        continue-on-error: true
        run: python pipeline/todo_report.py
      - name: Save refreshed data to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%F)"
          # main may have moved while the refresh ran (hours, for the FEC steps): replay this commit on top, keeping the freshly read data on a conflict
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs || { git rebase --abort; exit 1; }; done; exit 1
      - name: Post the to-do on its issue
        # One open issue titled "Weekly to-do"; each run adds the week's list as a comment, so the publisher gets one
        # notification. Never fails the run.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f data/watch/todo.md ] || exit 0
          if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" != "true" ]; then
            echo "::warning::Issues are turned off for this repository (Settings > General > Features > Issues), so the to-do was not posted. It is still in data/watch/todo.md."; exit 0
          fi
          # list, not search: the search index lags, so an issue created a moment ago is not found by --search
          n=$(gh issue list --state open --limit 200 --json number,title --jq 'map(select(.title == "Weekly to-do")) | .[0].number // empty')
          if [ -z "$n" ]; then
            url=$(gh issue create --title "Weekly to-do" --body "Each weekly refresh adds a comment here listing everything that needs a person: court dockets that moved, dead links, help lines to check again, stale sources and failed steps. Leave this issue open.")
            n=${url##*/}
          fi
          echo "Posting the to-do on issue #$n"
          gh issue comment "$n" --body-file data/watch/todo.md

# Mirrors this private repository's main branch to the public repository, pushed by the org's
# GitHub App (shows as polar-star-publisher[bot]). Lives in both repos; runs only in the private one.
name: publish
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh and publish"]   # refresh commits use GITHUB_TOKEN, which does not trigger push events
    types: [completed]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: >
      github.repository == 'Polar-Star-Project/polar-star-development' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Block restricted paths anywhere in history (fails closed)
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' .publish-deny > /tmp/deny || true
          [ -s /tmp/deny ] || { echo "::error::.publish-deny missing or empty"; exit 1; }
          hits=$(git log --name-only --format= HEAD | sort -u | grep -E -f /tmp/deny || true)
          if [ -n "$hits" ]; then echo "::error::Restricted paths in history:"; echo "$hits"; exit 1; fi
      - name: Block unapproved author/committer emails (fails closed)
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' .publish-authors > /tmp/allow || true
          [ -s /tmp/allow ] || { echo "::error::.publish-authors missing or empty"; exit 1; }
          bad=$(git log --format='%ae%n%ce' HEAD | sort -u | grep -vxF -f /tmp/allow || true)
          if [ -n "$bad" ]; then echo "::error::Unapproved emails in history:"; echo "$bad"; exit 1; fi
      - name: Block personal identifiers in tracked files (fails closed)
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: |
          set -euo pipefail
          [ -n "$IDENTITY_DENYLIST" ] || { echo "::error::IDENTITY_DENYLIST secret is not set"; exit 1; }
          hits=$(git grep -I -l -i -E "$IDENTITY_DENYLIST" HEAD -- . ':!data/reference/firm_income_all.csv' || true)
          if [ -n "$hits" ]; then echo "::error::Personal identifiers in:"; echo "$hits"; exit 1; fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        id: app
        with:
          client-id: ${{ vars.PUBLISH_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISH_PRIVATE_KEY }}
          repositories: polar-star
          permission-contents: write
          permission-workflows: write
      - name: Push to public repo (fast-forward only; never --force)
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: git push "https://x-access-token:${TOKEN}@github.com/Polar-Star-Project/polar-star.git" HEAD:refs/heads/main

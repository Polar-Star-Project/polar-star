# Mirrors this private repository's main branch to the public repository, pushed by the org's
# GitHub App (shows as polar-star-publisher[bot]). Lives in both repos; runs only in the private one.
name: publish
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh and publish"]   # refresh commits use GITHUB_TOKEN, which does not trigger push events
    types: [completed]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  restricted-name-gate:
    # Runs on tesseract, the only machine that can see the vault, on a runner kept for this check alone (label
    # polar-star-gate; the collector runners never see the restricted folder). Checks the exact commit about to be
    # published for any restricted donor name. Fails closed: no vault mounted means nothing publishes.
    if: >
      github.repository == 'Polar-Star-Project/polar-star-development' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, polar-star-gate]
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: No restricted name on the page (prints a count only, never a name)
        env:
          POLAR_STAR_RESTRICTED: /restricted/polar-star      # mounted read-only into the gate runner only
          POLAR_STAR_REQUIRE_RESTRICTED: "1"                 # a missing vault fails the check instead of skipping it
        run: python -c "import sys; sys.path.insert(0, 'pipeline'); import test_no_private_names as t; t.test_no_restricted_name_appears_on_the_page(); print('restricted-name check passed')"
  publish:
    needs: restricted-name-gate
    if: >
      github.repository == 'Polar-Star-Project/polar-star-development' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ needs.restricted-name-gate.outputs.sha }}   # publish exactly what the gate checked, even if main moved since
          fetch-depth: 0
          persist-credentials: false
      - name: Block restricted paths anywhere in history (fails closed)
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' .publish-deny > /tmp/deny || true
          [ -s /tmp/deny ] || { echo "::error::.publish-deny missing or empty"; exit 1; }
          hits=$(git log --name-only --format= HEAD | sort -u | grep -E -f /tmp/deny || true)
          if [ -n "$hits" ]; then echo "::error::Restricted paths in history:"; echo "$hits"; exit 1; fi
      - name: Block unapproved author/committer emails (fails closed)
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' .publish-authors > /tmp/allow || true
          [ -s /tmp/allow ] || { echo "::error::.publish-authors missing or empty"; exit 1; }
          bad=$(git log --format='%ae%n%ce' HEAD | sort -u | grep -vxF -f /tmp/allow || true)
          if [ -n "$bad" ]; then echo "::error::Unapproved emails in history:"; echo "$bad"; exit 1; fi
      - name: Block personal identifiers in tracked files (fails closed)
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: |
          set -euo pipefail
          [ -n "$IDENTITY_DENYLIST" ] || { echo "::error::IDENTITY_DENYLIST secret is not set"; exit 1; }
          hits=$(git grep -I -l -i -E "$IDENTITY_DENYLIST" HEAD -- . ':!data/reference/firm_income_all.csv' || true)
          if [ -n "$hits" ]; then echo "::error::Personal identifiers in:"; echo "$hits"; exit 1; fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510   # v3.3.0
        id: app
        with:
          client-id: ${{ vars.PUBLISH_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISH_PRIVATE_KEY }}
          repositories: polar-star
          permission-contents: write
          permission-workflows: write
      - name: Push to public repo (fast-forward only; never --force)
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: git push "https://x-access-token:${TOKEN}@github.com/Polar-Star-Project/polar-star.git" HEAD:refs/heads/main
